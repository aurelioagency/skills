<meta charset="utf-8">
<title>Carrusel — 04-plano-en-negativo</title>
<link rel="stylesheet" href="styles.css">
<script src="slide-data.js"></script>

<div id="root"></div>

<script>
// 04-plano-en-negativo. Se renderiza de a una slide con ?slide=N; sin parametro
// muestra todas apiladas.
//
// Las piezas de abajo son las que el template ya sabe dibujar. Cual va en cada slide lo
// decide el material, y se propone en el gate de aprobacion de copy. Las reglas del
// estilo y el listado completo de piezas estan en estilo.md.

const VIDEO = new URLSearchParams(location.search).has('video');

// Encabezado: numeracion + seccion a la izquierda, estado a la derecha.
// El estado es la firma del template: un punto de color y una palabra.
function tab(s, i, total) {
  const n = String(i + 1).padStart(2, '0');
  const t = String(total).padStart(2, '0');
  const st = s.state
    ? `<span class="state ${s.state.tone || ''}">● ${s.state.t}</span>`
    : `<span>${s.tabRight || ''}</span>`;
  return `<div class="tab"><span>${n}/${t} · ${s.tab}</span>${st}</div>`;
}

// Pie: fuente a la izquierda, firma a la derecha. La firma sale de slide-data.js:
// no la escribas en duro aca, o el primer carrusel de otra marca sale con el pie
// de esta. En el cierre la firma va grande.
// ?video=1 no cambia este pie: no hay prompt de swipe en este template.
function foot(s, big) {
  const d = window.CAROUSEL;
  return `
  <div class="foot${big ? ' big' : ''}">
    <span>${d.footerBrand}</span>
    <span class="sign">${d.footerAuthor}</span>
  </div>`;
}

// GRAMATICA DE LA MARCA: titular + filete + bajada. El filete va SIEMPRE, es lo
// que separa el titular del cuerpo en todo el template. Sin titular,
// render-and-audit.mjs marca red issue (excepcion documentada: 'slide-grammar').
function head(s, tight) {
  return `
    <div class="head${tight ? ' tight' : ''}">
      <h2${s.hsize ? ` style="font-size:${s.hsize}px"` : ''}>${s.headline}</h2>
      <div class="hr"></div>
      ${s.lede ? `<div class="lede">${s.lede}</div>` : ''}
    </div>`;
}

// Imagen que pasa el usuario (SKILL.md > Images the user supplies). El encuadre no se
// elige ni se ofrece en variantes: transparente va directo sobre el campo, opaco va
// enmarcado. Un opaco a sangre NO es una opcion: rompe el margen del disenio.
const userImg = s => !s.img ? '' : (s.imgTransparent
  ? `<div class="ext-plain"><img src="${s.img}" alt=""></div>`
  : `<div class="ext-card"><img src="${s.img}" alt=""></div>`);

// ---------- Iconos de Lucide/Tabler ----------
// El grosor real de la linea de este estilo, en px sobre el lienzo. Esta medido contra
// su propio chrome; el valor y el por que estan en estilo.md. NO se cambia por slide.
const ICON_REAL = 2.5;
const ICON_PX = 56;              // 40-56 segun cuanto peso cargue el slide

// `stroke-width` NO esta en pixeles: esta en las unidades del viewBox del icono, que en
// Lucide y en Tabler es 24. El mismo numero da lineas distintas segun el tamanio, por eso
// se calcula en vez de escribirse a mano.
//
// COMO SE USA: entra a lucide.dev o tabler.io/icons, copia el INTERIOR del <svg> (los
// <path>, sin la etiqueta <svg>) y pegalo en el slide como `ico: { d: '<path .../>' }`.
// Opcional `px` para cambiar el tamanio. El color sale del CSS de .ico.
const ico = (spec) => {
  if (!spec) return '';
  const px = spec.px || ICON_PX;
  const sw = +(ICON_REAL * 24 / px).toFixed(2);
  return `<svg class="ico" viewBox="0 0 24 24" style="width:${px}px;height:${px}px"
    fill="none" stroke="currentColor" stroke-width="${sw}"
    stroke-linecap="round" stroke-linejoin="round">${spec.d}</svg>`;
};

// ---------- Componentes ----------

// Dos cifras enfrentadas con una flecha. El valor va escrito, no dibujado: la
// magnitud la lee el lector del numero, no del tamanio.
const duo = s => `
  <div class="duo">
    <div class="col">
      <span class="lbl">${s.a.lbl}</span>
      <span class="fig ${s.a.tone || ''}">${s.a.v}</span>
    </div>
    <div class="arrow">→</div>
    <div class="col">
      <span class="lbl">${s.b.lbl}</span>
      <span class="fig ${s.b.tone || ''}">${s.b.v}</span>
    </div>
  </div>`;

const chips = items => `
  <div class="chips">
    ${items.map(c => `<span class="chip ${c.tone || ''}">${c.t}</span>`).join('')}
  </div>`;

// Fichas apiladas con filete de acento a la izquierda. Tres es el numero que
// entra sin apretar; cuatro ya obliga a bajar el cuerpo, que no es la salida.
const stack = items => `
  <div class="stack">
    ${items.map(c => `
      <div class="card ${c.tone || ''}">
        ${c.ico ? ico({ ...c.ico, px: c.ico.px || 48 }) : ''}
        <div class="ct">
          <div class="lbl">${c.lbl}</div>
          <div class="t">${c.t}</div>
        </div>
      </div>`).join('')}
  </div>`;

// Secciones: los bloques en que se divide el tema. Es el grafico de portada cuando lo que
// hay para mostrar es de que partes se compone, y no dos magnitudes que comparar.
// Campos: `secciones` = { lbl, items: [str] }.
const secciones = s => `
  <div class="secciones diagram">
    <div class="sec-lbl">${s.secciones.lbl}</div>
    <div class="sec-row">
      ${s.secciones.items.map(t => `<div class="sec">${t}</div>`).join('')}
    </div>
  </div>`;

// Secuencia numerada: un paso por ficha, con su numero en mono. Va cuando los pasos tienen
// orden obligatorio y no hay magnitud que comparar.
// Campos: `pasos` = [{ n, t }].
const pasos = items => `
  <div class="pasos">
    ${items.map(x => `
      <div class="paso">
        <div class="n">${x.n}</div>
        <div class="t">${x.t}</div>
      </div>`).join('')}
  </div>`;

// Dos cifras independientes, cada una con su rotulo y su detalle. Va cuando las dos
// magnitudes NO se comparan entre si: una barra afirmaria una proporcion que no existe.
// Campos: `cifras` = [{ n, u, lbl, t }].
const cifras = items => `
  <div class="cifras">
    ${items.map(c => `
      <div class="cifra">
        <div class="n">${c.n}${c.u ? `<span class="u">${c.u}</span>` : ''}</div>
        <div class="t">
          <div class="lbl">${c.lbl}</div>
          <div class="d">${c.t}</div>
        </div>
      </div>`).join('')}
  </div>`;

// Barras verticales con linea de base compartida. `h` es el porcentaje del alto y
// sale del dato medido. `pad` deja aire a la derecha para que dos barras no se
// lean como un grafico de dos categorias sobre todo el ancho.
const vbars = s => `
  <div class="vbars diagram">
    ${s.vbars.map(b => `
      <div class="col ${b.on ? 'on' : ''}">
        <span class="val">${b.val}</span>
        <div class="bar" style="height:${b.h}%"></div>
      </div>`).join('')}
    ${s.vbarsPad === false ? '' : '<div class="pad"></div>'}
  </div>`;

// Los items aceptan string, o { t, ico }. El icono reemplaza a la marca: no van los dos.
const checks = items => `
  <div class="checks">
    ${items.map(x => {
      const it = typeof x === 'string' ? { t: x } : x;
      return `<div class="ck">${it.ico ? ico({ ...it.ico, px: it.ico.px || 40 }) : '<span class="mk">▪</span>'}<span class="t">${it.t}</span></div>`;
    }).join('')}
  </div>`;

// ---------- Render ----------

function render(s, i, total) {
  let inner = '';

  // Portada: titular de 112px, filete, bajada, y las dos cifras con sus chips.
  // Es la unica slide con h1.
  if (s.type === 'cover') {
    inner = `
      <div class="head">
        <h1${s.hsize ? ` style="font-size:${s.hsize}px"` : ''}>${s.headline}</h1>
        <div class="hr"></div>
        <div class="lede">${s.lede}</div>
      </div>
      ${s.secciones ? secciones(s) : `
      <div class="mid">
        ${duo(s)}
        ${chips(s.chips)}
      </div>`}`;
  }

  if (s.type === 'stack') inner = `${head(s, true)}${stack(s.stack)}${userImg(s)}`;
  if (s.type === 'pasos')  inner = `${head(s, true)}${pasos(s.pasos)}`;
  if (s.type === 'cifras') inner = `${head(s, true)}${cifras(s.cifras)}`;
  // Imagen publicada por la fuente: encabezado + la imagen enmarcada.
  if (s.type === 'image')  inner = `${head(s, true)}${userImg(s)}`;

  if (s.type === 'bars') {
    inner = `
      ${head(s, true)}
      <div class="mid start">
        ${vbars(s)}
        ${s.after ? `<div class="lede">${s.after}</div>` : ''}
        ${s.punch ? `<div class="punch ${s.punchTone || ''}">${s.punch}</div>` : ''}
      </div>`;
  }

  // ...un bloque mas por cada layout que pida el carrusel. Patron:
  // head(s) + un componente. Un grafico propio va dentro de un contenedor `chart` o
  // `diagram`: eso habilita el piso de 24px para su capa de referencia.

  if (s.type === 'cta') {
    inner = `
      <div class="body">
        <h2 style="font-size:${s.hsize || 100}px">${s.headline}</h2>
        <div class="hr"></div>
        <div class="lede">${s.lede}</div>
        ${s.checks ? checks(s.checks) : ''}
      </div>`;
  }

  const isCTA = s.type === 'cta';
  return `<div class="slide s-${s.type}">
    <div class="grid"></div>
    ${tab(s, i, total)}
    ${inner}
    ${foot(s, isCTA)}
  </div>`;
}

const params = new URLSearchParams(location.search);
const data = window.CAROUSEL;
const total = data.slides.length;          // incluye la CTA
const idx = params.has('slide') ? parseInt(params.get('slide'), 10) - 1 : null;

if (idx === null) {
  document.getElementById('root').innerHTML =
    data.slides.map((s, i) => render(s, i, total)).join('<div style="height:40px"></div>');
} else {
  document.getElementById('root').innerHTML = render(data.slides[idx], idx, total);
}
</script>
