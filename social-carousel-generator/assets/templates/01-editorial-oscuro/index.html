<meta charset="utf-8">
<title>Carrusel — plantilla</title>
<link rel="stylesheet" href="styles.css">
<script src="slide-data.js"></script>

<div id="root"></div>

<script>
// Plantilla minima. Agrega un bloque por tipo de slide en render().
// Se renderiza de a una slide con ?slide=N; sin parametro muestra todas apiladas.

// Geometria para 1080x1440. Para 1080x1920 escala viewBox, cy y ry por 1.3333:
// cy 333/627/1307/1613, ry 307/360/333/387, rx igual.
// stroke-width 1.6 con .contours en opacidad 1: a 1.2/0.5 la linea no se ve.
const CONTOURS = `
<svg class="contours" viewBox="0 0 1080 1440" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#211d1b" stroke-width="1.6">
    <ellipse cx="540" cy="250"  rx="900" ry="230"/>
    <ellipse cx="540" cy="470"  rx="980" ry="270"/>
    <ellipse cx="540" cy="980"  rx="900" ry="250"/>
    <ellipse cx="540" cy="1210" rx="1000" ry="290"/>
  </g>
</svg>`;

// El contador cuenta TODAS las imagenes, incluida la CTA final.
// La marca y el swipe salen de slide-data.js: no los escribas en duro aca, o el
// primer carrusel de otra marca sale con el footer de esta.
//
// ?video=1 omite el prompt de swipe: en un Short no hay nada que deslizar, y la
// linea queda como un residuo del carrusel. build-short.mjs renderiza con este
// flag; el carrusel se renderiza sin el y no cambia.
const VIDEO = new URLSearchParams(location.search).has('video');
function footer(i, total) {
  const d = window.CAROUSEL;
  return `
  <div class="footer">
    <div class="brand">${d.footerBrand}</div>
    <div class="counter">${i + 1}/${total}</div>
    ${VIDEO ? '' : `<div class="swipe">${d.footerSwipe || '← Desliza'}</div>`}
  </div>`;
}

// GRAMATICA DE LA MARCA, no un helper opcional:
//   kicker -> titular -> cuerpo chico -> componente -> veredicto
// Todo slide de contenido pasa por aca. Sin titular, render-and-audit.mjs lo marca
// como red issue (excepcion documentada: 'slide-grammar'). El titular puede ser una
// cifra dominante de 90px o mas, pero no un cuerpo inflado.
function head(s) {
  return `
    <div class="head-block">
      <div class="kicker ${s.accent || ''}">${s.kicker}</div>
      <h1${s.hsize ? ` style="font-size:${s.hsize}px"` : ''}>${s.headline}</h1>
      ${s.body ? `<div class="body-copy">${s.body}</div>` : ''}
      ${s.serif ? `<div class="serif-line">${s.serif}</div>` : ''}
    </div>`;
}

// ---------- Iconos de Lucide/Tabler ----------
// El grosor real de la linea de este estilo, en px sobre el lienzo. Esta medido contra
// su propio chrome; el valor y el por que estan en estilo.md. NO se cambia por slide.
const ICON_REAL = 2;
const ICON_PX = 56;              // 40-56 segun cuanto peso cargue el slide

// `stroke-width` NO esta en pixeles: esta en las unidades del viewBox del icono, que en
// Lucide y en Tabler es 24. El mismo numero da lineas distintas segun el tamanio, por eso
// se calcula en vez de escribirse a mano.
//
// COMO SE USA: entra a lucide.dev o tabler.io/icons, copia el INTERIOR del <svg> (los
// <path>, sin la etiqueta <svg>) y pegalo en el slide como `ico: { d: '<path .../>' }`.
// Opcional `px` para cambiar el tamanio. El color sale del CSS de .ico.
const ico = (spec) => {
  if (!spec) return '';
  const px = spec.px || ICON_PX;
  const sw = +(ICON_REAL * 24 / px).toFixed(2);
  return `<svg class="ico" viewBox="0 0 24 24" style="width:${px}px;height:${px}px"
    fill="none" stroke="currentColor" stroke-width="${sw}"
    stroke-linecap="round" stroke-linejoin="round">${spec.d}</svg>`;
};

// Componentes del set publicado. Usalos antes de inventar uno nuevo.
const verdict = s => s.verdict ? `<div class="verdict">${s.verdict}</div>` : '';
const mascot  = s => s.mascot ? `<div class="mascot-row"><img class="mascot" src="${s.mascot}" alt=""></div>` : '';

// Tres barras de acento, anchos decrecientes.
// Imagen que pasa el usuario (SKILL.md > Images the user supplies). El encuadre no se
// elige ni se ofrece en variantes: transparente va directo sobre el campo, opaco va
// enmarcado. `s.img` es la ruta dentro de assets/; `s.imgTransparent: true` marca el
// PNG/SVG sin fondo.
//
// Un opaco a sangre NO es una opcion: rompe el margen lateral y el ancho extra no compra
// legibilidad, porque el texto quemado es ilegible a este tamanio de lienzo igual.
const userImg = s => !s.img ? '' : (s.imgTransparent
  ? `<div class="ext-plain"><img src="${s.img}" alt=""></div>`
  : `<div class="ext-card"><img src="${s.img}" alt=""></div>`);

const BARS = `<div class="bars"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>`;

// Checklist: items con marca de color.
// Los items aceptan string, o { t, ico } si el item lleva icono. El icono reemplaza a
// la marca de color: no van los dos, o la fila arranca con dos senializadores.
const checklist = items =>
  `<div class="checklist">${items.map(x => {
    const it = typeof x === 'string' ? { t: x } : x;
    return `<div class="ci">${it.ico ? ico({ ...it.ico, px: it.ico.px || 44 }) : '<span class="mk"></span>'}<div class="tx">${it.t}</div></div>`;
  }).join('')}</div>`;

// Flujo vertical de cajas con flecha hacia abajo. Clases de caja: trigger | agent | human.
const flow = steps => `
  <div class="flow">
    ${steps.map((f, k) => `
      <div class="fbox ${f.cls}">
        <div class="lbl">${f.lbl}</div>
        <div class="t">${f.t}</div>
        ${f.s ? `<div class="s">${f.s}</div>` : ''}
      </div>
      ${k < steps.length - 1 ? '<div class="fdown">↓</div>' : ''}`).join('')}
  </div>`;

// Grilla 2x2 de tarjetas.
const grid = cards => `
  <div class="dec-grid">
    ${cards.map(c => `<div class="dc"><div class="lbl">${c.lbl}</div><div class="t">${c.t}</div></div>`).join('')}
  </div>`;

function render(s, i, total) {
  const isCTA = s.type === 'cta';
  let inner = '';

  // Portada: titular en Archivo Black, giro en serif italica (otra fuente y otro
  // color), los dos centrados, y un grafico simple debajo. Reparte el aire con dos
  // .spacer en vez de un margin-top fijo: el margen fijo pasa el chequeo de balance
  // vertical y aun asi deja un agujero en el medio de la slide.
  if (s.type === 'cover') {
    inner = `
      <div class="stage">
        <div class="kicker ${s.accent || ''}">${s.kicker}</div>
        <h1>${s.headline}</h1>
        <div class="twist">${s.twist}</div>
        <div class="spacer"></div>
        <div class="fanout">
          <div class="hub">${s.hub}</div>
          <div class="stem"></div>
          <div class="bus"></div>
          <div class="nets">
            ${s.nets.map((n, k) => `<span class="${k === s.nets.length - 1 ? 'last' : ''}"><b>${n}</b></span>`).join('')}
          </div>
        </div>
        <div class="spacer"></div>
      </div>`;
  }

  // ...un bloque por cada tipo de slide del carrusel.
  // Patron: head(s) + un componente + verdict(s). Ejemplo:
  //
  //   if (s.type === 'mecanismo') {
  //     inner = `
  //       <div class="stage">
  //         ${head(s)}
  //         <div class="spacer"></div>
  //         ${flow(s.flow)}
  //         <div class="spacer"></div>
  //         ${verdict(s)}
  //       </div>`;
  //   }
  //
  // Un grafico propio va dentro de un contenedor `chart` o `diagram`: eso es lo que
  // habilita el piso de 24px para sus rotulos, marcas de escala y referencias.

  if (isCTA) {
    inner = `<img class="cta-base" src="${s.asset}" alt="CTA">
             <div class="footer cta-footer"><div class="counter">${total}/${total}</div></div>`;
  }

  const chrome = isCTA ? '' : footer(i, total);
  const field = isCTA ? '' : CONTOURS;
  return `<div class="slide s-${s.type}">${field}${inner}${chrome}</div>`;
}

const params = new URLSearchParams(location.search);
const data = window.CAROUSEL;
const total = data.slides.length;          // incluye la CTA
const idx = params.has('slide') ? parseInt(params.get('slide'), 10) - 1 : null;

if (idx === null) {
  document.getElementById('root').innerHTML =
    data.slides.map((s, i) => render(s, i, total)).join('<div style="height:40px"></div>');
} else {
  document.getElementById('root').innerHTML = render(data.slides[idx], idx, total);
}
</script>
