        .platform-name{position:absolute;left:50%;top:50%;padding:7px 13px 9px;border-bottom:6px solid #e2987f;color:#111;font-size:38px;font-weight:700;letter-spacing:-2px;line-height:1;text-transform:uppercase;transform:translate(-50%,-50%);white-space:nowrap}
        .platform-card.chatgpt .platform-name{border-bottom-color:#264b32;font-size:34px}
        .platform-card.gemini .platform-name{border-bottom-color:#3858bf;font-size:36px}

        .routes{position:absolute;inset:0;width:1080px;height:1920px;z-index:5}

        .routes circle{fill:#f4efe3;stroke:#e2987f;stroke-width:5;opacity:0}
      </style>

          <span data-hf-id="hf-0e5z" class="platform-name" data-layout-allow-occlusion="">GEMINI</span>

        <svg data-hf-id="hf-ftst" id="rlb-routes" class="routes" viewBox="0 0 1080 1920" aria-hidden="true">
          <path data-hf-id="hf-rtbq" id="rlb-route-claude" d="M540 1392 C430 1320 320 1240 240 1120" />

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines=window.__timelines||{};
        var tl=gsap.timeline({paused:true});

        ["#rlb-route-claude","#rlb-route-chatgpt","#rlb-route-gemini"].forEach(function(sel){
          var path=document.querySelector(sel);
          var len=path.getTotalLength();
          path.style.strokeDasharray=String(len);
          path.style.strokeDashoffset=String(len);
        });

        tl.fromTo("#rlb-chip-caption",{opacity:0,scale:.86,y:30},{opacity:1,scale:1,y:0,duration:.34,ease:"power3.out"},.12);
        tl.fromTo("#rlb-line-1",{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:.42,ease:"power2.out"},.20);
        tl.fromTo("#rlb-chip-assets",{opacity:0,scale:.86,x:45},{opacity:1,scale:1,x:0,duration:.34,ease:"power3.out"},.95);
        tl.fromTo("#rlb-line-2",{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:.42,ease:"power2.out"},1.02);
        tl.fromTo("#rlb-chip-motion",{opacity:0,scale:.86,y:45},{opacity:1,scale:1,y:0,duration:.34,ease:"power3.out"},1.75);
        tl.fromTo("#rlb-line-3",{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:.42,ease:"power2.out"},1.82);
        tl.to("#rlb-return-copy",{y:-90,scale:.82,opacity:.28,duration:.48,ease:"power2.inOut"},1.78);
        tl.to("#rlb-return-copy",{opacity:0,duration:.18,ease:"power1.in"},2.34);
        tl.fromTo("#rlb-all-copy",{opacity:0,y:75},{opacity:1,y:0,duration:.30,ease:"power4.out"},2.55);
        tl.to(["#rlb-chip-caption","#rlb-chip-assets","#rlb-chip-motion","#rlb-line-1","#rlb-line-2","#rlb-line-3"],{opacity:0,duration:.28,ease:"power1.in"},2.68);

        var driver={p:0};
        tl.to(driver,{p:1,duration:1.02,ease:"power3.out",onUpdate:function(){
          var p=driver.p;
          var cardP=Math.min(1,p/.50);
          gsap.set("#rlb-card",{x:140*cardP,y:310*cardP,scale:1-.72*cardP,rotation:-5*cardP,opacity:1-cardP});
          gsap.set("#rlb-folder",{y:-320*(1-p),scale:.76+.24*p,opacity:.12+.34*p});
        }},2.72);
        tl.to("#rlb-all-copy",{y:-320,opacity:0,duration:.38,ease:"power2.in"},3.62);

        tl.set("#rlb-las",{opacity:1,y:48},4.00);
        tl.to("#rlb-las",{y:0,duration:.14,ease:"power4.out"},4.00);
        tl.set("#rlb-genere",{opacity:1,y:72},4.35);
        tl.to("#rlb-genere",{y:0,duration:.19,ease:"power4.out"},4.35);
        tl.set("#rlb-conuna",{opacity:1,y:44},5.05);
        tl.to("#rlb-conuna",{y:0,duration:.14,ease:"power4.out"},5.05);
        tl.set("#rlb-skill",{opacity:1,scale:.90},5.60);
        tl.to("#rlb-skill",{scale:1,duration:.35,ease:"power3.out"},5.60);
        tl.to("#rlb-folder",{y:0,scale:1,opacity:1,duration:.62,ease:"power3.out"},5.60);
        tl.to("#rlb-folder-label",{opacity:1,duration:.18,ease:"power1.out"},5.90);
        tl.set("#rlb-para",{opacity:1,y:40},6.35);
        tl.to("#rlb-para",{y:0,duration:.14,ease:"power4.out"},6.35);
        tl.set("#rlb-claude-name",{opacity:1,y:64},6.48);
        tl.to("#rlb-claude-name",{y:0,duration:.18,ease:"power4.out"},6.48);
        tl.fromTo("#rlb-claude",
          {opacity:0,x:300,y:360,scale:.20,rotation:0},
          {opacity:1,x:0,y:0,scale:1,rotation:-4,duration:.68,ease:"power3.out"},
          6.32
        );

        tl.to("#rlb-lockup",{y:-430,rotation:-2,opacity:0,duration:.35,ease:"power3.in"},6.60);
        tl.fromTo("#rlb-compat",{opacity:0,y:72},{opacity:1,y:0,duration:.30,ease:"power3.out"},6.95);
        tl.to("#rlb-route-claude",{strokeDashoffset:0,duration:.52,ease:"power2.out"},7.05);
        tl.to("#rlb-route-chatgpt",{strokeDashoffset:0,duration:.52,ease:"power2.out"},7.15);
        tl.to("#rlb-route-gemini",{strokeDashoffset:0,duration:.52,ease:"power2.out"},7.25);
        tl.to(".routes circle",{opacity:1,duration:.24,ease:"power1.out"},7.05);

        tl.fromTo("#rlb-chatgpt",
          {opacity:0,x:0,y:330,scale:.18,rotation:0},
          {opacity:1,x:0,y:0,scale:1,rotation:0,duration:.72,ease:"power3.out"},
          7.25
        );
        tl.fromTo("#rlb-chatgpt-name",{opacity:0,y:52},{opacity:1,y:0,duration:.28,ease:"power4.out"},7.25);
        tl.fromTo("#rlb-o",{opacity:0,y:28},{opacity:1,y:0,duration:.20,ease:"power4.out"},7.80);
        tl.fromTo("#rlb-gemini-name",{opacity:0,x:120},{opacity:1,x:0,duration:.58,ease:"power3.out"},8.05);
        tl.fromTo("#rlb-gemini",
          {opacity:0,x:-300,y:420,scale:.18,rotation:0},
          {opacity:1,x:0,y:0,scale:1,rotation:4,duration:.58,ease:"power3.out"},
          8.05
        );

        window.__timelines["rlb"]=tl;
      </script>
    </template>
  </body>
