<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; width:1920px; height:1080px; background:transparent; overflow:hidden; }
  * { box-sizing: border-box; font-family: 'Inter Black', sans-serif; }
  @font-face { font-family: 'Inter Black'; src: url('__FONT_URL__') format('truetype'); font-weight: 900; }

  .panel { background: rgba(10,14,12,0.82); border-radius: 16px; }

  /* ---- text card: position variants set via data-pos on #textcard ---- */
  #textcard {
    position: absolute; display: none; align-items: stretch;
    padding: 26px 40px 26px 60px;
  }
  #textcard.active { display: inline-flex; }
  #textcard[data-pos="bottom-left"]   { left: 96px;  bottom: 90px; transform-origin: left bottom; }
  #textcard[data-pos="bottom-center"] { left: 50%;   bottom: 90px; transform: translateX(-50%); transform-origin: center bottom; }
  #textcard[data-pos="top-left"]      { left: 96px;  top: 70px;    transform-origin: left top; }
  #textcard[data-pos="top-center"]    { left: 50%;   top: 70px;    transform: translateX(-50%); transform-origin: center top; }
  #textcard[data-pos="center"]        { left: 50%;   top: 50%;     transform: translate(-50%,-50%); transform-origin: center; }

  .bar { position:absolute; left:0; top:10px; bottom:10px; width:8px; border-radius:4px; transform:scaleY(0); transform-origin: top; }
  .lines { display:flex; flex-direction:column; gap:14px; }
  .line { display:flex; flex-wrap:nowrap; white-space:nowrap; }
  .word { font-weight:900; color:#fff; margin-right:16px; display:inline-block; opacity:0; transform:translateY(28px); }
  .word.size-normal { font-size:54px; }
  .word.size-big { font-size:80px; }
  .word.size-small { font-size:38px; }

  /* ---- punch text (centered, single emphasis line) ---- */
  #punch {
    position:absolute; left:50%; top:50%; display:none;
    transform: translate(-50%,-50%) scale(0.5);
    font-size: 96px; color:#fff; opacity:0; white-space:nowrap; text-align:center;
  }
  #punch.active { display:block; }
  #punch .accent { color: var(--punch-accent, #30D5FF); }

  /* ---- step list (roadmap-style ticking checklist) ---- */
  #steplist { position:absolute; left:50%; bottom:90px; transform:translateX(-50%); display:none; gap:20px; }
  #steplist[data-pos="top-center"] { bottom:auto; top:70px; }
  #steplist.active { display:flex; }
  .step { padding: 20px 32px 20px 24px; display:flex; align-items:center; gap:16px; opacity:0; transform: translateY(24px); }
  .step-check { width:40px; height:40px; border-radius:50%; border:3px solid var(--step-accent,#30D5FF); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .step-check svg { width:22px; height:22px; }
  .step-label { font-size:34px; color:#fff; font-weight:900; white-space:nowrap; }
</style>
</head>
<body>

  <div id="textcard" class="panel" data-pos="bottom-left">
    <div class="bar"></div>
    <div class="lines" id="textcard-lines"></div>
  </div>

  <div id="punch"></div>

  <div id="steplist"></div>

<script>
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }
  function easeOutBack(x){ const c1=1.6,c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }
  const STAGGER=0.045, WORD_ANIM=0.32;

  /* ================= text card ================= */
  // config: { lines:[["w","w2"],[...]], accent:"#hex", accentWords:[...], position:"bottom-left", size:"normal" }
  window.__textcardSet = function(config){
    const card = document.getElementById('textcard');
    card.dataset.pos = config.position || 'bottom-left';
    card.querySelector('.bar').style.background = config.accent || '#7ED957';
    const sizeClass = 'size-' + (config.size || 'normal');
    const linesEl = document.getElementById('textcard-lines');
    linesEl.innerHTML = '';
    config.lines.forEach((words) => {
      const lineEl = document.createElement('div');
      lineEl.className = 'line';
      words.forEach((w) => {
        const span = document.createElement('span');
        const isAccent = (config.accentWords || []).includes(w);
        span.className = 'word ' + sizeClass;
        if (isAccent) span.style.color = config.accent || '#7ED957';
        span.textContent = w;
        lineEl.appendChild(span);
      });
      linesEl.appendChild(lineEl);
    });
  };
  window.__textcardShow = function(){ document.getElementById('textcard').classList.add('active'); };
  window.__textcardHide = function(){ document.getElementById('textcard').classList.remove('active'); };
  window.__textcardReset = function(){
    const card = document.getElementById('textcard'); card.style.opacity='1';
  };
  window.__textcardEnter = function(t){
    const card = document.getElementById('textcard');
    const boxP = clamp01(t/0.18); const boxEased = easeOutCubic(boxP);
    card.style.opacity = String(boxEased);
    const baseTransform = getComputedStyle(card).getPropertyValue('--base-transform') || '';
    const scale = 0.92+0.08*boxEased;
    card.style.transform = (card.dataset.pos === 'bottom-center' || card.dataset.pos === 'top-center')
      ? `translateX(-50%) scale(${scale})`
      : (card.dataset.pos === 'center' ? `translate(-50%,-50%) scale(${scale})` : `scale(${scale})`);
    card.querySelector('.bar').style.transform = `scaleY(${easeOutCubic(clamp01(t/0.35))})`;
    card.querySelectorAll('.word').forEach((w,i)=>{
      const start=i*STAGGER; const p=clamp01((t-start)/WORD_ANIM); const eased=easeOutBack(p);
      w.style.opacity = String(clamp01((t-start)/(WORD_ANIM*0.6)));
      w.style.transform = `translateY(${28*(1-eased)}px)`;
    });
  };
  window.__textcardExit = function(t){
    const card = document.getElementById('textcard'); const p = clamp01(t/0.32); const eased = easeOutCubic(p);
    card.style.opacity = String(1-eased);
    const shiftY = -22*eased;
    card.style.transform = (card.dataset.pos === 'bottom-center' || card.dataset.pos === 'top-center')
      ? `translateX(-50%) translateY(${shiftY}px)`
      : (card.dataset.pos === 'center' ? `translate(-50%,-50%) translateY(${shiftY}px)` : `translateY(${shiftY}px)`);
  };
  window.__textcardEnterDur = function(wordCount){
    return 0.7 + Math.max(0, wordCount-1)*STAGGER + WORD_ANIM;
  };
  window.__EXIT_DUR = 0.32;

  /* ================= punch text ================= */
  // config: { html: "Vamos <span class='accent'>con ello.</span>", accent:"#hex" }
  window.__punchSet = function(config){
    const el = document.getElementById('punch');
    el.style.setProperty('--punch-accent', config.accent || '#30D5FF');
    el.innerHTML = config.html;
  };
  window.__punchShow = function(){ document.getElementById('punch').classList.add('active'); };
  window.__punchHide = function(){ document.getElementById('punch').classList.remove('active'); };
  window.__punchEnter = function(t){
    const el = document.getElementById('punch'); const p = clamp01(t/0.4); const eased = easeOutBack(p);
    el.style.opacity = String(clamp01(t/0.22));
    el.style.transform = `translate(-50%,-50%) scale(${0.5+0.5*eased})`;
  };
  window.__punchExit = function(t){
    const el = document.getElementById('punch'); const p = clamp01(t/0.3);
    el.style.opacity = String(1-p);
  };
  window.__PUNCH_DUR = { ENTER: 0.45, EXIT: 0.3 };

  /* ================= step list ================= */
  // config: { steps:[{label,tickAt}], accent:"#hex", position:"bottom-center" }
  let __stepEls = [];
  window.__steplistSet = function(config){
    const el = document.getElementById('steplist');
    el.dataset.pos = config.position || 'bottom-center';
    el.style.setProperty('--step-accent', config.accent || '#30D5FF');
    el.innerHTML = '';
    __stepEls = config.steps.map((step) => {
      const div = document.createElement('div');
      div.className = 'step panel';
      div.dataset.tickAt = step.tickAt;
      div.innerHTML = `<div class="step-check"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="${config.accent || '#30D5FF'}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:30; stroke-dashoffset:30;"/></svg></div><div class="step-label">${step.label}</div>`;
      el.appendChild(div);
      return div;
    });
  };
  window.__steplistShow = function(){ document.getElementById('steplist').classList.add('active'); };
  window.__steplistReset = function(){
    const el = document.getElementById('steplist');
    el.style.opacity='1';
    el.style.transform = el.dataset.pos === 'top-center' ? 'translateX(-50%)' : 'translateX(-50%)';
  };
  window.__steplistFrame = function(t){
    __stepEls.forEach((step) => {
      const tickAt = Number(step.dataset.tickAt);
      const localT = t - tickAt;
      const p = clamp01(localT/0.35);
      const eased = easeOutBack(p);
      step.style.opacity = String(clamp01(localT/0.2));
      step.style.transform = `translateY(${24*(1-eased)}px)`;
      const checkPath = step.querySelector('.step-check path');
      const checkP = clamp01((localT-0.15)/0.25);
      checkPath.style.strokeDashoffset = String(30*(1-checkP));
    });
  };
  window.__steplistExit = function(t){
    const el = document.getElementById('steplist');
    const p = clamp01(t/0.3);
    el.style.opacity = String(1-p);
    el.style.transform = `translateX(-50%) translateY(${-18*p}px)`;
  };
</script>
</body>
</html>
